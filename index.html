<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>療程用藥紀錄</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    body { -webkit-tap-highlight-color: transparent; }
    .hide-scroll::-webkit-scrollbar { display: none; }
    .hide-scroll { -ms-overflow-style: none; scrollbar-width: none; }
    .pb-safe { padding-bottom: env(safe-area-inset-bottom, 20px); }
    /* 自訂浮動提示動畫 */
    @keyframes fadeInOut {
      0% { opacity: 0; transform: translate(-50%, -20px); }
      10% { opacity: 1; transform: translate(-50%, 0); }
      90% { opacity: 1; transform: translate(-50%, 0); }
      100% { opacity: 0; transform: translate(-50%, -20px); }
    }
    .animate-toast {
      animation: fadeInOut 3s forwards;
    }
  </style>
</head>
<body class="bg-[#F5F5F0] overflow-x-hidden text-[#5C636A] font-sans">
  
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    // ====== 請將 GAS 網址貼在下方引號內 ======
    const GAS_API_URL = 'https://script.google.com/macros/s/AKfycbxKXHlDFizkcCMc9cDlMh74hLmUKMpVxS-5YG50J0jkQqTgRzSOQVNHfgOExO4wsxTyBQ/exec'; 
    // =========================================

    function App() {
      // 頁籤與日期狀態
      const [activeTab, setActiveTab] = useState('daily');
      const [currentDate, setCurrentDate] = useState(new Date());

      // 月曆專用狀態
      const [selectedCalDate, setSelectedCalDate] = useState(new Date());
      const [currentCalMonth, setCurrentCalMonth] = useState(new Date());

      // 核心資料狀態
      const [medLibrary, setMedLibrary] = useState([]);
      const [medications, setMedications] = useState([]);
      const [dailyRecords, setDailyRecords] = useState({});
      const [isLoading, setIsLoading] = useState(true);

      // 自訂訊息提示狀態 (取代 alert)
      const [toastMsg, setToastMsg] = useState('');

      const showMessage = (msg) => {
        setToastMsg(msg);
        setTimeout(() => setToastMsg(''), 3000);
      };

      useEffect(() => {
        if(!GAS_API_URL) {
          setIsLoading(false);
          return;
        }
        fetch(GAS_API_URL)
          .then(res => res.json())
          .then(data => {
            setMedLibrary(Array.isArray(data.medLibrary) ? data.medLibrary : []);
            setMedications(Array.isArray(data.medications) ? data.medications : []);
            setDailyRecords(data.dailyRecords || {});
            setIsLoading(false);
          })
          .catch(err => {
            console.error("讀取失敗", err);
            setIsLoading(false);
          });
      }, []);

      const syncDataToCloud = (newLib, newMeds, newRecords) => {
        if(!GAS_API_URL) return;
        fetch(GAS_API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          redirect: 'follow',
          body: JSON.stringify({
            medLibrary: newLib || medLibrary,
            medications: newMeds || medications,
            dailyRecords: newRecords || dailyRecords
          })
        }).catch(err => console.error("儲存失敗", err));
      };

      const formatDateKey = (d) => {
        return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
      };

      const [newLibName, setNewLibName] = useState('');
      const [newLibApp, setNewLibApp] = useState('');
      const [newLibType, setNewLibType] = useState('pill'); // pill, injection, suppository
      
      const handleLibAdd = (e) => {
        e.preventDefault();
        if (!newLibName.trim()) return;
        
        const exists = medLibrary.some(item => 
          (typeof item === 'string' ? item : item.name) === newLibName.trim()
        );
        if (exists) {
          showMessage('藥品已存在於庫存中！');
          return;
        }

        const newItem = { name: newLibName.trim(), appearance: newLibApp.trim(), type: newLibType };
        const newLib = [...medLibrary, newItem];
        setMedLibrary(newLib);
        setNewLibName('');
        setNewLibApp('');
        setNewLibType('pill');
        syncDataToCloud(newLib, null, null);
        showMessage('已加入藥品庫！');
      };

      const handleLibDelete = (nameToDelete) => {
        const newLib = medLibrary.filter(item => {
          const itemName = typeof item === 'string' ? item : item.name;
          return itemName !== nameToDelete;
        });
        setMedLibrary(newLib);
        syncDataToCloud(newLib, null, null);
      };

      const [setupData, setSetupData] = useState({
        name: '', appearance: '', efficacy: '', dosage: '', type: 'pill',
        times: { morning: false, noon: false, night: false, bed: false },
        days: []
      });
      const [customDateStr, setCustomDateStr] = useState('');

      const [editingMedId, setEditingMedId] = useState(null);
      const [editingTimeKey, setEditingTimeKey] = useState(null); // 新增：紀錄正在編輯哪個時段
      const [editDosageValue, setEditDosageValue] = useState('');

      // 新增：取得特定時段的劑量 (若無設定則抓預設值)
      const getMedDosage = (med, timeKey) => {
        const defaultDosage = med.type === 'injection' ? '1支' : med.type === 'suppository' ? '1次' : '1顆';
        if (timeKey && med.dosages && med.dosages[timeKey]) {
          return med.dosages[timeKey]; // 優先抓取特定時段的劑量
        }
        return med.dosage || defaultDosage; // 否則抓取整體預設劑量
      };

      const next7Days = Array.from({ length: 7 }, (_, i) => {
        const d = new Date();
        d.setDate(d.getDate() + i);
        return d;
      });

      const handleSetupChange = (e) => {
        const { name, value } = e.target;
        if (name === 'name') {
          const selectedMed = medLibrary.find(item => (typeof item === 'string' ? item : item.name) === value);
          const defaultApp = selectedMed && typeof selectedMed === 'object' ? selectedMed.appearance : '';
          const defaultType = selectedMed && typeof selectedMed === 'object' && selectedMed.type ? selectedMed.type : 'pill';
          setSetupData(prev => ({ ...prev, name: value, appearance: defaultApp || prev.appearance, type: defaultType }));
        } else {
          setSetupData(prev => ({ ...prev, [name]: value }));
        }
      };

      const handleSetupToggleTime = (time) => {
        setSetupData(prev => ({ ...prev, times: { ...prev.times, [time]: !prev.times[time] } }));
      };

      const handleSetupToggleDay = (dateStr) => {
        setSetupData(prev => ({
          ...prev,
          days: prev.days.includes(dateStr) ? prev.days.filter(d => d !== dateStr) : [...prev.days, dateStr]
        }));
      };

      const handleCustomDateAdd = (e) => {
        if (!customDateStr) return;
        if (!setupData.days.includes(customDateStr)) {
          setSetupData(prev => ({ ...prev, days: [...prev.days, customDateStr] }));
        }
        setCustomDateStr('');
      };

      const handleSetupSubmit = (e) => {
        e.preventDefault();
        if (!setupData.name) return showMessage('請選擇藥品');
        if (!Object.values(setupData.times).some(v => v)) return showMessage('請至少選擇一個時段');
        if (setupData.days.length === 0) return showMessage('請至少選擇一天');

        let defaultDosage = '1顆';
        if (setupData.type === 'injection') defaultDosage = '1支';
        if (setupData.type === 'suppository') defaultDosage = '1次';
        
        const finalDosage = setupData.dosage.trim() === '' ? defaultDosage : setupData.dosage;

        const newMeds = [...medications, { id: Date.now().toString(), ...setupData, dosage: finalDosage }];
        setMedications(newMeds);
        setSetupData({
          name: '', appearance: '', efficacy: '', dosage: '',
          times: { morning: false, noon: false, night: false, bed: false },
          days: []
        });
        syncDataToCloud(null, newMeds, null);
        showMessage('排程新增成功！');
      };

      const handleSetupDelete = (id) => {
        const newMeds = medications.filter(m => m.id !== id);
        setMedications(newMeds);
        syncDataToCloud(null, newMeds, null);
      };

      const handleSetupEditStart = (med, timeKey = 'all') => {
        setEditingMedId(med.id);
        setEditingTimeKey(timeKey); // 記錄目前正在編輯哪個時段
        
        const currentDosage = getMedDosage(med, timeKey === 'all' ? null : timeKey);
        // 自動過濾掉中文字，只留下數字或小數點
        const numStr = currentDosage.replace(/[^0-9.]/g, '') || '1';
        setEditDosageValue(numStr);
      };

      const handleSetupEditSave = (id) => {
        const med = medications.find(m => m.id === id);
        if (!med) return;
        const unit = med.type === 'injection' ? '支' : med.type === 'suppository' ? '次' : '顆';
        // 儲存時，自動將數字與對應的單位組合回去
        const finalDosage = editDosageValue ? `${editDosageValue}${unit}` : `1${unit}`;
        
        const newMeds = medications.map(m => {
          if (m.id === id) {
            if (editingTimeKey === 'all') {
              return { ...m, dosage: finalDosage }; // 修改整體預設
            } else {
              const newDosages = { ...(m.dosages || {}) };
              newDosages[editingTimeKey] = finalDosage; // 獨立修改該時段的劑量
              return { ...m, dosages: newDosages };
            }
          }
          return m;
        });
        
        setMedications(newMeds);
        setEditingMedId(null);
        setEditingTimeKey(null);
        syncDataToCloud(null, newMeds, null);
      };

      const handleSetupEditCancel = () => {
        setEditingMedId(null);
        setEditingTimeKey(null);
      };

      // 新增：從特定日期移除排程 (供今日打卡與月曆使用，不影響其他天的紀錄)
      const handleRemoveDate = (id, dateStr) => {
        const newMeds = medications.map(m => {
          if (m.id === id) {
            return { ...m, days: m.days.filter(d => d !== dateStr) };
          }
          return m;
        }).filter(m => m.days.length > 0); // 如果天數扣到變 0，就完全刪除
        setMedications(newMeds);
        syncDataToCloud(null, newMeds, null);
        showMessage('已從此日移除排程！');
      };

      const changeDate = (days) => {
        const d = new Date(currentDate);
        d.setDate(d.getDate() + days);
        setCurrentDate(d);
      };

      const toggleDailyRecord = (medId, timeKey, specificDateKey = null) => {
        const dateKey = specificDateKey || formatDateKey(currentDate);
        const newRecords = { ...dailyRecords };
        if (!newRecords[dateKey]) newRecords[dateKey] = {};
        
        const recordKey = `${medId}_${timeKey}`;
        newRecords[dateKey][recordKey] = !newRecords[dateKey][recordKey];
        
        setDailyRecords(newRecords);
        syncDataToCloud(null, null, newRecords);
      };

      if (isLoading) {
        return <div className="min-h-screen flex items-center justify-center text-[#8A9A95]">載入資料中...</div>;
      }

      const renderLibraryView = () => (
        <div className="space-y-6 pb-24">
          <header className="text-center pt-6 pb-2">
            <h1 className="text-2xl font-bold text-[#8A9A95] flex items-center justify-center gap-2">
              <i className="fa-solid fa-book-open text-xl"></i> 藥品庫
            </h1>
            <p className="text-sm text-[#A3B1A6] mt-2">建檔後，將於設定排程時自動帶入</p>
          </header>
          <section className="bg-white p-5 rounded-2xl shadow-sm border border-[#E5E4DE] mx-4">
            <form onSubmit={handleLibAdd} className="space-y-3">
              <div className="flex gap-2 mb-2">
                <button type="button" onClick={() => setNewLibType('pill')} className={`flex-1 py-2 rounded-xl text-sm font-medium transition-colors border ${newLibType === 'pill' ? 'bg-[#A3B1A6] text-white border-[#A3B1A6]' : 'bg-[#FAFAFA] text-[#8F9CA4] border-[#E5E4DE]'}`}>
                  <i className="fa-solid fa-pills mr-1"></i> 口服
                </button>
                <button type="button" onClick={() => setNewLibType('injection')} className={`flex-1 py-2 rounded-xl text-sm font-medium transition-colors border ${newLibType === 'injection' ? 'bg-[#D98A8A] text-white border-[#D98A8A]' : 'bg-[#FAFAFA] text-[#8F9CA4] border-[#E5E4DE]'}`}>
                  <i className="fa-solid fa-syringe mr-1"></i> 針劑
                </button>
                <button type="button" onClick={() => setNewLibType('suppository')} className={`flex-1 py-2 rounded-xl text-sm font-medium transition-colors border ${newLibType === 'suppository' ? 'bg-[#95A1C3] text-white border-[#95A1C3]' : 'bg-[#FAFAFA] text-[#8F9CA4] border-[#E5E4DE]'}`}>
                  <i className="fa-solid fa-capsules mr-1"></i> 塞劑
                </button>
              </div>
              
              <input type="text" value={newLibName} onChange={(e) => setNewLibName(e.target.value)} placeholder={newLibType === 'pill' ? "藥物名稱 (必填)" : newLibType === 'injection' ? "針劑名稱 (必填)" : "塞劑名稱 (必填)"} className="w-full p-3 bg-[#FAFAFA] border border-[#E5E4DE] rounded-xl focus:outline-none focus:ring-2 focus:ring-[#B3C0BA]" required />
              <input type="text" value={newLibApp} onChange={(e) => setNewLibApp(e.target.value)} placeholder={newLibType === 'pill' ? "外觀 (選填，如: 白圓錠)" : newLibType === 'injection' ? "施打方式/備註 (選填)" : "備註 (選填，如: 睡前使用)"} className="w-full p-3 bg-[#FAFAFA] border border-[#E5E4DE] rounded-xl focus:outline-none focus:ring-2 focus:ring-[#B3C0BA]" />
              <button type="submit" className="w-full bg-[#8A9A95] text-white p-3 rounded-xl hover:bg-[#788883] transition-colors flex justify-center items-center gap-2">
                <i className="fa-solid fa-plus text-lg"></i> 加入庫存
              </button>
            </form>
          </section>
          <div className="mx-4 space-y-2">
            {medLibrary.map((item, idx) => {
              const name = typeof item === 'string' ? item : item.name;
              const app = typeof item === 'string' ? '' : item.appearance;
              const type = typeof item === 'object' && item.type ? item.type : 'pill';
              
              return (
                <div key={idx} className="flex justify-between items-center p-4 bg-white rounded-xl border border-[#E5E4DE]">
                  <div>
                    <span className="font-medium text-[#4A5568] flex items-center gap-2">
                      {type === 'injection' ? 
                        <i className="fa-solid fa-syringe text-sm text-[#D98A8A]"></i> : 
                       type === 'suppository' ?
                        <i className="fa-solid fa-capsules text-sm text-[#95A1C3]"></i> :
                        <i className="fa-solid fa-pills text-sm text-[#A3B1A6]"></i>
                      }
                      {name}
                    </span>
                    {app && <div className="text-xs text-[#8F9CA4] ml-6 mt-1">{app}</div>}
                  </div>
                  <button onClick={() => handleLibDelete(name)} className="text-[#D1C8C1] hover:text-[#D98A8A]">
                    <i className="fa-solid fa-trash-can text-lg"></i>
                  </button>
                </div>
              );
            })}
            {medLibrary.length === 0 && <p className="text-center text-[#B4A9A2] py-8">藥品庫目前空空如也</p>}
          </div>
        </div>
      );

      const renderSetupView = () => (
        <div className="space-y-6 pb-24">
          <header className="text-center pt-6 pb-2">
            <h1 className="text-2xl font-bold text-[#8A9A95] flex items-center justify-center gap-2">
              <i className="fa-solid fa-gear text-xl"></i> 藥單設定
            </h1>
          </header>
          <section className="bg-white p-5 rounded-2xl shadow-sm border border-[#E5E4DE] mx-4">
            <form onSubmit={handleSetupSubmit} className="space-y-4">
              <div className="space-y-1 relative">
                <label className="text-sm font-medium text-[#8F9CA4]">選擇藥品</label>
                <select name="name" value={setupData.name} onChange={handleSetupChange} className="w-full p-3 bg-[#FAFAFA] border border-[#E5E4DE] rounded-xl focus:outline-none focus:ring-2 focus:ring-[#B3C0BA]">
                  <option value="">-- 請選擇 (從藥品庫抓取) --</option>
                  {medLibrary.map((item, idx) => {
                    const name = typeof item === 'string' ? item : item.name;
                    return <option key={idx} value={name}>{name}</option>;
                  })}
                </select>
              </div>
              <div className="grid grid-cols-2 gap-3">
                <input type="text" name="appearance" value={setupData.appearance} onChange={handleSetupChange} placeholder={setupData.type === 'injection' ? "施打方式/備註" : setupData.type === 'suppository' ? "備註" : "外觀"} className="w-full p-3 bg-[#FAFAFA] border border-[#E5E4DE] rounded-xl text-sm" />
                <input type="text" name="dosage" value={setupData.dosage} onChange={handleSetupChange} placeholder={setupData.type === 'injection' ? "劑量 (預設1支)" : setupData.type === 'suppository' ? "用量 (預設1次)" : "每次用量 (預設1顆)"} className="w-full p-3 bg-[#FAFAFA] border border-[#E5E4DE] rounded-xl text-sm" />
              </div>
              <input type="text" name="efficacy" value={setupData.efficacy} onChange={handleSetupChange} placeholder="功效 (選填)" className="w-full p-3 bg-[#FAFAFA] border border-[#E5E4DE] rounded-xl text-sm" />
              <div className="space-y-2">
                <label className="text-sm font-medium text-[#8F9CA4]">選擇用藥日期</label>
                <div className="flex gap-2 overflow-x-auto hide-scroll pb-2">
                  {next7Days.map(d => {
                    const dateStr = formatDateKey(d);
                    const isSelected = setupData.days.includes(dateStr);
                    return (
                      <button key={dateStr} type="button" onClick={() => handleSetupToggleDay(dateStr)} className={`flex-shrink-0 px-3 py-2 rounded-xl border text-sm transition-colors ${isSelected ? 'bg-[#8A9A95] text-white border-[#8A9A95]' : 'bg-[#FAFAFA] border-[#E5E4DE] text-[#8F9CA4]'}`}>
                        {d.getMonth()+1}/{d.getDate()}
                      </button>
                    );
                  })}
                </div>
                <div className="flex gap-2 mt-2">
                  <input type="date" value={customDateStr} onChange={e => setCustomDateStr(e.target.value)} className="flex-1 p-2 border border-[#E5E4DE] rounded-xl text-sm bg-[#FAFAFA]" />
                  <button type="button" onClick={handleCustomDateAdd} className="bg-[#B3C0BA] text-white px-4 rounded-xl text-sm">新增日期</button>
                </div>
                {setupData.days.length > 0 && (
                  <div className="flex flex-wrap gap-2 mt-2">
                    {setupData.days.sort().map(d => (
                      <span key={d} className="bg-[#E5E4DE] text-[#5C636A] text-xs px-2 py-1 rounded-md flex items-center gap-1">
                        {d} <button type="button" onClick={() => handleSetupToggleDay(d)} className="text-[#8F9CA4] hover:text-red-400">&times;</button>
                      </span>
                    ))}
                  </div>
                )}
              </div>
              <div className="space-y-2">
                <label className="text-sm font-medium text-[#8F9CA4]">選擇時段 (可複選)</label>
                <div className="grid grid-cols-4 gap-2">
                  {Object.entries({ morning: '早上', noon: '中午', night: '晚上', bed: '睡前' }).map(([key, label]) => (
                    <button key={key} type="button" onClick={() => handleSetupToggleTime(key)} className={`py-2 rounded-xl border text-sm transition-colors ${setupData.times[key] ? 'bg-[#A3B1A6] text-white border-[#A3B1A6]' : 'bg-[#FAFAFA] border-[#E5E4DE] text-[#8F9CA4]'}`}>
                      {label}
                    </button>
                  ))}
                </div>
              </div>
              <button type="submit" className="w-full bg-[#A3B1A6] hover:bg-[#8A9A95] text-white py-3 rounded-xl flex justify-center items-center gap-2">
                <i className="fa-solid fa-list-check text-lg"></i> 加入排程
              </button>
            </form>
          </section>
          
          <div className="mx-4 space-y-3">
            <h3 className="font-medium text-[#8A9A95] pl-1">進行中與未來排程</h3>
            {/* 修改：只顯示還有「今天以後」日期的排程 */}
            {medications.filter(med => med.days.some(d => d >= formatDateKey(new Date()))).map(med => {
              const isEditingThisGlobal = editingMedId === med.id && editingTimeKey === 'all';
              const defaultDosage = med.type === 'injection' ? '1支' : med.type === 'suppository' ? '1次' : '1顆';
              return (
                <div key={med.id} className="p-4 bg-white rounded-xl border border-[#E5E4DE] relative">
                  
                  {/* ====== 右上角按鈕區 (編輯與刪除) ====== */}
                  <div className="absolute top-3 right-3 flex gap-3">
                    {!isEditingThisGlobal && (
                      <button onClick={() => handleSetupEditStart(med, 'all')} className="text-[#8A9A95] hover:text-[#5C636A] transition-colors p-1" title="編輯預設用量">
                        <i className="fa-solid fa-pen text-lg"></i>
                      </button>
                    )}
                    <button onClick={() => handleSetupDelete(med.id)} className="text-[#D1C8C1] hover:text-[#D98A8A] transition-colors p-1" title="刪除此排程">
                      <i className="fa-solid fa-trash-can text-lg"></i>
                    </button>
                  </div>
                  {/* ================================== */}
                  
                  <div className="font-medium text-[#4A5568] pr-20">
                    <span className="flex items-center gap-2">
                      {med.type === 'injection' ? <i className="fa-solid fa-syringe text-[#D98A8A]"></i> : med.type === 'suppository' ? <i className="fa-solid fa-capsules text-[#95A1C3]"></i> : <i className="fa-solid fa-pills text-[#A3B1A6]"></i>}
                      {med.name}
                    </span>
                    
                    {/* 編輯狀態 */}
                    {isEditingThisGlobal ? (
                      <div className="flex items-center gap-2 mt-2">
                        <input 
                          type="number" 
                          inputMode="decimal"
                          value={editDosageValue} 
                          onChange={(e) => setEditDosageValue(e.target.value)} 
                          className="w-16 p-1.5 text-sm bg-[#FAFAFA] border border-[#B3C0BA] rounded-lg focus:outline-none focus:ring-1 focus:ring-[#8A9A95] text-center"
                          placeholder="數量"
                        />
                        <span className="text-sm text-[#8A9A95] font-medium">{med.type === 'injection' ? '支' : med.type === 'suppository' ? '次' : '顆'}</span>
                        <button onClick={() => handleSetupEditSave(med.id)} className="text-xs bg-[#8A9A95] text-white px-3 py-2 rounded-lg hover:bg-[#788883]">儲存</button>
                        <button onClick={handleSetupEditCancel} className="text-xs bg-[#E5E4DE] text-[#5C636A] px-3 py-2 rounded-lg hover:bg-[#D6DAD8]">取消</button>
                      </div>
                    ) : (
                      <span className="text-sm text-[#8A9A95] block mt-1">
                        用量: {med.dosage || defaultDosage}
                      </span>
                    )}
                  </div>
                  <div className="text-xs text-[#8F9CA4] mt-2 space-y-1">
                    <div>📆 共 {med.days.length} 天設定</div>
                    <div>⏰ 時段: {['morning', 'noon', 'night', 'bed'].filter(k => med.times[k]).map(k => ({morning:'早',noon:'中',night:'晚',bed:'睡前'})[k]).join(', ')}</div>
                  </div>
                </div>
              );
            })}
          </div>
        </div>
      );

      const renderDailyView = () => {
        const currentDateKey = formatDateKey(currentDate);
        const todaysMeds = medications.filter(med => med.days.includes(currentDateKey));
        const timeBlocks = [
          { key: 'morning', label: '早上' },
          { key: 'noon', label: '中午' },
          { key: 'night', label: '晚上' },
          { key: 'bed', label: '睡前' }
        ];

        return (
          <div className="space-y-4 pb-24">
            <header className="bg-white border-b border-[#E5E4DE] sticky top-0 z-10 px-4 py-3 shadow-sm flex items-center justify-between">
              <button onClick={() => changeDate(-1)} className="p-2 text-[#8A9A95] w-10 h-10 flex items-center justify-center hover:bg-[#F5F5F0] rounded-full transition-colors"><i className="fa-solid fa-chevron-left text-xl"></i></button>
              <h2 className="font-bold text-[#4A5568] text-lg">{currentDate.getMonth()+1}月{currentDate.getDate()}日 排程</h2>
              <button onClick={() => changeDate(1)} className="p-2 text-[#8A9A95] w-10 h-10 flex items-center justify-center hover:bg-[#F5F5F0] rounded-full transition-colors"><i className="fa-solid fa-chevron-right text-xl"></i></button>
            </header>
            
            <div className="px-4 space-y-6 pt-2">
              {timeBlocks.map(({ key, label }) => {
                const medsInThisTime = todaysMeds.filter(m => m.times[key]);
                if (medsInThisTime.length === 0) return null;

                return (
                  <div key={key} className="space-y-2">
                    <h3 className="font-bold text-[#8A9A95] flex items-center gap-2 pl-1">
                      <i className="fa-regular fa-clock text-sm"></i> {label}
                    </h3>
                    {medsInThisTime.map(med => {
                      const recordKey = `${med.id}_${key}`;
                      const isTaken = dailyRecords[currentDateKey]?.[recordKey] || false;
                      const isInjection = med.type === 'injection';
                      const isSuppository = med.type === 'suppository';
                      
                      const displayDosage = getMedDosage(med, key);
                      const isEditingThisSlot = editingMedId === med.id && editingTimeKey === key;
                      
                      let mainColorClass = isTaken ? (isInjection ? 'bg-[#D98A8A] border-[#D98A8A] text-white' : isSuppository ? 'bg-[#95A1C3] border-[#95A1C3] text-white' : 'bg-[#A3B1A6] border-[#A3B1A6] text-white') : 'border-[#B3C0BA] text-transparent';
                      let textColorClass = isInjection ? 'text-[#D98A8A]' : isSuppository ? 'text-[#95A1C3]' : 'text-[#8A9A95]';
                      let iconClass = isInjection ? "fa-solid fa-syringe" : isSuppository ? "fa-solid fa-capsules" : "fa-solid fa-capsules";
                      let badgeBg = isInjection ? "bg-[#FFF0F0]" : isSuppository ? "bg-[#F0F2F8]" : "bg-[#F0F5F2]";
                      
                      return (
                        <div key={recordKey} className={`flex items-center gap-3 p-4 rounded-2xl border transition-all ${isTaken ? 'bg-[#F9F9F8] border-[#E5E4DE] opacity-60' : 'bg-white border-[#D6DAD8] shadow-sm hover:shadow-md'}`}>
                          
                          {/* 左側：可點擊打卡的區塊 */}
                          <div onClick={() => toggleDailyRecord(med.id, key)} className="flex flex-1 items-center gap-3 cursor-pointer min-w-0">
                            <div className={`flex-shrink-0 w-8 h-8 rounded-full border-2 flex items-center justify-center transition-colors ${mainColorClass}`}>
                              <i className="fa-solid fa-check text-lg"></i>
                            </div>
                            <div className="flex-1 min-w-0">
                              <h4 className={`font-medium text-lg truncate flex items-center gap-2 ${isTaken ? 'line-through text-[#9BA3A0]' : 'text-[#4A5568]'}`}>
                                {med.name}
                                {isInjection && !isTaken && <span className={`text-[10px] ${badgeBg} ${textColorClass} px-2 py-0.5 rounded-full font-bold`}>針劑</span>}
                                {isSuppository && !isTaken && <span className={`text-[10px] ${badgeBg} ${textColorClass} px-2 py-0.5 rounded-full font-bold`}>塞劑</span>}
                              </h4>
                              
                              {!isEditingThisSlot && (
                                <div className="flex flex-wrap gap-x-3 gap-y-1 text-xs text-[#8F9CA4] mt-0.5">
                                  <span className={`flex items-center gap-1 font-semibold ${textColorClass}`}>
                                    <i className={`${iconClass} text-xs`}></i> 
                                    {displayDosage}
                                  </span>
                                  {med.appearance && <span className="flex items-center gap-1"><i className={isInjection || isSuppository ? "fa-solid fa-info-circle text-xs" : "fa-solid fa-font text-xs"}></i> {med.appearance}</span>}
                                  {med.efficacy && <span className="flex items-center gap-1"><i className="fa-solid fa-circle-info text-xs"></i> {med.efficacy}</span>}
                                </div>
                              )}
                            </div>
                          </div>

                          {/* 右側：編輯與單日刪除按鈕 */}
                          {isEditingThisSlot ? (
                            <div className="flex flex-col gap-1 items-end ml-2">
                              <div className="flex items-center gap-1">
                                <input type="number" inputMode="decimal" value={editDosageValue} onChange={(e) => setEditDosageValue(e.target.value)} className="w-12 p-1 text-sm bg-[#FAFAFA] border border-[#B3C0BA] rounded focus:outline-none text-center" placeholder="數量"/>
                                <span className="text-xs text-[#8A9A95] font-medium">{isInjection ? '支' : isSuppository ? '次' : '顆'}</span>
                              </div>
                              <div className="flex gap-1">
                                <button onClick={() => handleSetupEditSave(med.id)} className="text-[10px] bg-[#8A9A95] text-white px-2 py-1 rounded hover:bg-[#788883]">儲存</button>
                                <button onClick={handleSetupEditCancel} className="text-[10px] bg-[#E5E4DE] text-[#5C636A] px-2 py-1 rounded hover:bg-[#D6DAD8]">取消</button>
                              </div>
                            </div>
                          ) : (
                            <div className="flex gap-2 pl-2 border-l border-[#F0F0F0]">
                              <button onClick={() => handleSetupEditStart(med, key)} className="text-[#C4CACA] hover:text-[#8A9A95] p-1 transition-colors" title="編輯用量">
                                <i className="fa-solid fa-pen text-sm"></i>
                              </button>
                              <button onClick={() => handleRemoveDate(med.id, currentDateKey)} className="text-[#C4CACA] hover:text-[#D98A8A] p-1 transition-colors" title="移除今日排程">
                                <i className="fa-solid fa-trash-can text-sm"></i>
                              </button>
                            </div>
                          )}
                        </div>
                      );
                    })}
                  </div>
                );
              })}
              {todaysMeds.length === 0 && <div className="text-center py-16 text-[#B4A9A2]">這天沒有排程藥物唷！</div>}
            </div>
          </div>
        );
      };

      const renderCalendarView = () => {
        const year = currentCalMonth.getFullYear();
        const month = currentCalMonth.getMonth();
        
        const firstDay = new Date(year, month, 1).getDay();
        const daysInMonth = new Date(year, month + 1, 0).getDate();
        
        const prevMonth = () => setCurrentCalMonth(new Date(year, month - 1, 1));
        const nextMonth = () => setCurrentCalMonth(new Date(year, month + 1, 1));

        const selectedDateKey = formatDateKey(selectedCalDate);
        const selectedMeds = medications.filter(med => med.days.includes(selectedDateKey));
        
        const timeBlocks = [
          { key: 'morning', label: '早上' },
          { key: 'noon', label: '中午' },
          { key: 'night', label: '晚上' },
          { key: 'bed', label: '睡前' }
        ];

        return (
          <div className="flex flex-col h-screen pb-[80px]">
            <div className="flex-none bg-white pt-6 pb-4 px-4 shadow-sm z-10 relative">
              <div className="flex justify-between items-center mb-4">
                <button onClick={prevMonth} className="w-10 h-10 flex items-center justify-center text-[#8A9A95] hover:bg-[#F5F5F0] rounded-full transition-colors"><i className="fa-solid fa-chevron-left"></i></button>
                <h2 className="text-xl font-bold text-[#4A5568]">{year} 年 {month + 1} 月</h2>
                <button onClick={nextMonth} className="w-10 h-10 flex items-center justify-center text-[#8A9A95] hover:bg-[#F5F5F0] rounded-full transition-colors"><i className="fa-solid fa-chevron-right"></i></button>
              </div>
              
              <div className="grid grid-cols-7 gap-1 text-center mb-2">
                {['日', '一', '二', '三', '四', '五', '六'].map(d => (
                  <div key={d} className="text-xs font-medium text-[#8F9CA4] py-1">{d}</div>
                ))}
              </div>
              
              <div className="grid grid-cols-7 gap-y-2 gap-x-1">
                {Array.from({ length: firstDay }).map((_, i) => (
                  <div key={`empty-${i}`} className="h-10"></div>
                ))}
                
                {Array.from({ length: daysInMonth }).map((_, i) => {
                  const date = i + 1;
                  const currentIterDate = new Date(year, month, date);
                  const iterDateKey = formatDateKey(currentIterDate);
                  
                  const isSelected = selectedCalDate.getDate() === date && selectedCalDate.getMonth() === month && selectedCalDate.getFullYear() === year;
                  const isToday = new Date().getDate() === date && new Date().getMonth() === month && new Date().getFullYear() === year;
                  
                  const hasMeds = medications.some(med => med.days.includes(iterDateKey));

                  return (
                    <div key={date} className="flex justify-center items-center h-11 w-full">
                      <button 
                        onClick={() => setSelectedCalDate(currentIterDate)}
                        className={`w-10 h-10 flex flex-col items-center justify-center rounded-full relative transition-all mx-auto
                          ${isSelected ? 'bg-[#8A9A95] text-white shadow-md' : 'text-[#4A5568] hover:bg-[#E5E4DE]'}
                          ${!isSelected && isToday ? 'font-bold border-2 border-[#8A9A95]' : ''}
                        `}
                      >
                        <span className="text-[15px] relative z-10 leading-none mb-1">{date}</span>
                        {hasMeds && (
                          <span className={`w-1.5 h-1.5 rounded-full absolute bottom-[6px] ${isSelected ? 'bg-white' : 'bg-[#B3C0BA]'}`}></span>
                        )}
                      </button>
                    </div>
                  );
                })}
              </div>
            </div>

            <div className="flex-1 bg-[#F5F5F0] overflow-y-auto px-4 py-4 hide-scroll">
              <h3 className="font-bold text-[#8A9A95] mb-3 flex items-center gap-2">
                <i className="fa-regular fa-calendar-check text-sm"></i> 
                {selectedCalDate.getMonth() + 1}/{selectedCalDate.getDate()} 待辦用藥
              </h3>
              
              <div className="space-y-4">
                {timeBlocks.map(({ key, label }) => {
                  const medsInThisTime = selectedMeds.filter(m => m.times[key]);
                  if (medsInThisTime.length === 0) return null;

                  return (
                    <div key={key} className="bg-white rounded-2xl p-4 shadow-sm border border-[#E5E4DE]">
                      <h4 className="text-sm font-bold text-[#A3B1A6] mb-3 border-b border-[#F0F0F0] pb-2">{label}</h4>
                      <div className="space-y-3">
                        {medsInThisTime.map(med => {
                          const recordKey = `${med.id}_${key}`;
                          const isTaken = dailyRecords[selectedDateKey]?.[recordKey] || false;
                          const isInjection = med.type === 'injection';
                          const isSuppository = med.type === 'suppository';
                          
                          const displayDosage = getMedDosage(med, key);
                          const isEditingThisSlot = editingMedId === med.id && editingTimeKey === key;
                          
                          let mainColorClass = isTaken ? (isInjection ? 'bg-[#D98A8A] border-[#D98A8A] text-white' : isSuppository ? 'bg-[#95A1C3] border-[#95A1C3] text-white' : 'bg-[#A3B1A6] border-[#A3B1A6] text-white') : 'border-[#C4CACA] text-transparent group-hover:border-[#A3B1A6]';
                          let textColorClass = isTaken ? 'text-[#B4A9A2]' : (isInjection ? 'text-[#D98A8A]' : isSuppository ? 'text-[#95A1C3]' : 'text-[#8A9A95]');
                          let iconClass = isInjection ? "fa-solid fa-syringe" : isSuppository ? "fa-solid fa-capsules" : "fa-solid fa-capsules";
                          
                          return (
                            <div key={recordKey} className="flex items-center justify-between gap-2 group">
                              
                              {/* 月曆左側：可點擊打卡的區塊 */}
                              <div onClick={() => toggleDailyRecord(med.id, key, selectedDateKey)} className="flex items-center gap-3 cursor-pointer flex-1 min-w-0">
                                <div className={`w-6 h-6 flex-shrink-0 rounded-full border-[1.5px] flex items-center justify-center transition-all ${mainColorClass}`}>
                                  <i className="fa-solid fa-check text-xs"></i>
                                </div>
                                <div className={`text-base font-medium transition-all flex items-center gap-1.5 truncate ${isTaken ? 'line-through text-[#B4A9A2] opacity-70' : 'text-[#5C636A]'}`}>
                                  {(isInjection || isSuppository) && <i className={`${iconClass} text-xs ${textColorClass}`}></i>}
                                  {med.name} 
                                  {!isEditingThisSlot && (
                                    <span className={`text-sm ${textColorClass} font-semibold flex-shrink-0`}>
                                      ({displayDosage})
                                    </span>
                                  )}
                                </div>
                              </div>

                              {/* 月曆右側：編輯與單日刪除按鈕 */}
                              {isEditingThisSlot ? (
                                <div className="flex items-center gap-1 ml-2">
                                  <input type="number" inputMode="decimal" value={editDosageValue} onChange={(e) => setEditDosageValue(e.target.value)} className="w-10 p-1 text-xs bg-[#FAFAFA] border border-[#B3C0BA] rounded text-center" />
                                  <span className="text-xs text-[#8A9A95] font-medium mr-1">{isInjection ? '支' : isSuppository ? '次' : '顆'}</span>
                                  <button onClick={() => handleSetupEditSave(med.id)} className="text-[10px] bg-[#8A9A95] text-white px-2 py-1 rounded">存</button>
                                  <button onClick={handleSetupEditCancel} className="text-[10px] bg-[#E5E4DE] text-[#5C636A] px-2 py-1 rounded">消</button>
                                </div>
                              ) : (
                                <div className="flex gap-2">
                                  <button onClick={() => handleSetupEditStart(med, key)} className="text-[#E5E4DE] hover:text-[#8A9A95] p-1"><i className="fa-solid fa-pen text-xs"></i></button>
                                  <button onClick={() => handleRemoveDate(med.id, selectedDateKey)} className="text-[#E5E4DE] hover:text-[#D98A8A] p-1"><i className="fa-solid fa-trash-can text-xs"></i></button>
                                </div>
                              )}
                            </div>
                          );
                        })}
                      </div>
                    </div>
                  );
                })}
                {selectedMeds.length === 0 && (
                  <div className="text-center py-10 text-[#B4A9A2] flex flex-col items-center gap-2">
                    <i className="fa-solid fa-mug-hot text-2xl text-[#E5E4DE]"></i>
                    <p className="text-sm">這天沒有排程用藥，好好休息！</p>
                  </div>
                )}
              </div>
            </div>
          </div>
        );
      };

      return (
        <div className="min-h-screen relative w-full font-sans">
          {/* 自訂訊息 Toast */}
          {toastMsg && (
            <div className="fixed top-12 left-1/2 -translate-x-1/2 bg-[#4A5568] text-white px-5 py-3 rounded-full shadow-lg z-50 text-sm flex items-center gap-2 animate-toast whitespace-nowrap">
              <i className="fa-solid fa-circle-check text-[#A3B1A6]"></i> {toastMsg}
            </div>
          )}

          {activeTab === 'daily' && renderDailyView()}
          {activeTab === 'calendar' && renderCalendarView()}
          {activeTab === 'setup' && renderSetupView()}
          {activeTab === 'library' && renderLibraryView()}

          <nav className="fixed bottom-0 w-full bg-white border-t border-[#E5E4DE] pb-safe shadow-[0_-4px_20px_rgba(0,0,0,0.03)] z-40">
            <div className="flex justify-around items-center p-2">
              <button onClick={() => setActiveTab('daily')} className={`flex flex-col items-center p-2 w-16 transition-colors ${activeTab === 'daily' ? 'text-[#8A9A95]' : 'text-[#C4CACA]'}`}>
                <i className="fa-solid fa-clipboard-check text-2xl mb-1"></i>
                <span className="text-[10px] font-medium">今日</span>
              </button>
              <button onClick={() => setActiveTab('calendar')} className={`flex flex-col items-center p-2 w-16 transition-colors ${activeTab === 'calendar' ? 'text-[#8A9A95]' : 'text-[#C4CACA]'}`}>
                <i className="fa-regular fa-calendar-days text-2xl mb-1"></i>
                <span className="text-[10px] font-medium">月曆</span>
              </button>
              <button onClick={() => setActiveTab('setup')} className={`flex flex-col items-center p-2 w-16 transition-colors ${activeTab === 'setup' ? 'text-[#8A9A95]' : 'text-[#C4CACA]'}`}>
                <i className="fa-solid fa-gear text-2xl mb-1"></i>
                <span className="text-[10px] font-medium">排程</span>
              </button>
              <button onClick={() => setActiveTab('library')} className={`flex flex-col items-center p-2 w-16 transition-colors ${activeTab === 'library' ? 'text-[#8A9A95]' : 'text-[#C4CACA]'}`}>
                <i className="fa-solid fa-book-open text-2xl mb-1"></i>
                <span className="text-[10px] font-medium">藥品</span>
              </button>
            </div>
          </nav>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
